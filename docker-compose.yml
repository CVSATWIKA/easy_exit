
services:
  db:
    image: postgres:16
    container_name: easy-exit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: easy_exit
      POSTGRES_USER: easyexit_user
      POSTGRES_PASSWORD: easyexit_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyexit_user -d easy_exit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: easy-exit-backend:latest
    container_name: easy-exit-backend
    restart: unless-stopped
    ports:
      - "30081:8000"
    environment:
      DATABASE_URL: postgresql://easyexit_user:easyexit_password@db:5432/easy_exit
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             gunicorn easy_exit_backend.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    image: easy-exit-frontend:latest
    container_name: easy-exit-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
